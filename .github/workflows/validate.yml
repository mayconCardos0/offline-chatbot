name: Validate Project Structure

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check required files exist
      run: |
        test -f requirements.txt || (echo "requirements.txt missing" && exit 1)
        test -f .env.example || (echo ".env.example missing" && exit 1)
        test -f README.md || (echo "README.md missing" && exit 1)
        test -f .gitignore || (echo ".gitignore missing" && exit 1)
        echo "✓ All required files present"
    
    - name: Check required directories exist
      run: |
        test -d api || (echo "api/ directory missing" && exit 1)
        test -d core || (echo "core/ directory missing" && exit 1)
        test -d llm || (echo "llm/ directory missing" && exit 1)
        test -d rag || (echo "rag/ directory missing" && exit 1)
        test -d scripts || (echo "scripts/ directory missing" && exit 1)
        echo "✓ All required directories present"
    
    - name: Validate .env.example format
      run: |
        grep -q "PORT=" .env.example || (echo ".env.example missing PORT" && exit 1)
        grep -q "MODEL_PATH=" .env.example || (echo ".env.example missing MODEL_PATH" && exit 1)
        grep -q "EMBED_MODEL_NAME=" .env.example || (echo ".env.example missing EMBED_MODEL_NAME" && exit 1)
        echo "✓ .env.example has required variables"
    
    - name: Check no .env file committed
      run: |
        if [ -f .env ]; then
          echo "ERROR: .env file should not be committed"
          exit 1
        fi
        echo "✓ No .env file in repository"
    
    - name: Check no large model files committed
      run: |
        if find models -name "*.gguf" 2>/dev/null | grep -q .; then
          echo "ERROR: .gguf model files should not be committed"
          exit 1
        fi
        echo "✓ No large model files committed"
